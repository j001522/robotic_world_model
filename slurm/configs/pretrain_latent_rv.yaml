# =============================================================================
# Latent-Space World Model Pretraining with Reward + Value Heads (Phase 3)
# =============================================================================
# Extends Phase 1+2 latent pretraining with:
#   - Reward head: predicts scalar reward from cat(z, a)
#   - Value head ensemble: predicts V(z) with TD targets and EMA target heads
#
# These heads provide task-relevant gradient signals to the encoder,
# shaping the latent space to preserve reward-critical features.
#
# Training signal:
#   state_loss = consistency_coef * MSE(z_pred, z_target_ema)
#              + reconstruction_coef * MSE(dec(z_pred), s_next)
#              + encoder_consistency_coef * MSE(enc(s_next), sg(z_pred))
#   reward_loss = MSE(reward_head(z, a), r_actual)
#   value_loss  = MSE(value_head(z), r + gamma*(1-d)*V_target(z'))
#
# Usage:
#   sbatch --job-name=pretrain-latent-rv --partition=gpu_a100 --time=24:00:00 \
#          slurm_train.sh configs/pretrain_latent_rv.yaml
# =============================================================================

mode: pretrain
task: Template-Isaac-Velocity-Flat-Anymal-D-Pretrain-v0
max_iterations: 2500

model:
  # Ensemble configuration
  ensemble_size: 5
  
  # Latent-space architecture (Phase 1)
  latent_mode: true
  latent_dim: 256
  simnorm_dim: 8
  encoder_hidden_dims: [256]
  decoder_hidden_dims: [256]
  latent_head_hidden_dims: [256]
  encoder_dropout: 0.0
  
  # Phase 2: Consistency loss with EMA target encoder
  target_encoder_momentum: 0.99
  consistency_coef: 2.0
  reconstruction_coef: 1.0
  encoder_consistency_coef: 0.0
  
  # Randomized priors
  prior_scale: 1.0
  prior_hidden_div: 4
  bootstrap: false
  uncertainty_metric: std
  
  # Phase 3: Reward and Value heads
  reward_head_enabled: true
  value_head_enabled: true
  value_ensemble_size: 5
  reward_hidden_dims: [256, 256]
  value_hidden_dims: [256, 256]
  reward_prior_scale: 1.0
  value_prior_scale: 1.0
  value_gamma: 0.99

architecture:
  # Backbone type: rnn (GRU)
  # Change to "xlstm" and add xlstm_* params to use xLSTM backbone instead
  type: rnn
  rnn_type: gru
  
  # Head shapes (shared across all backbone types)
  state_mean_shape: [128]
  state_logstd_shape: [128]
  extension_shape: [128]
  contact_shape: [128]
  termination_shape: [128]

training:
  num_envs: 4096
  wm_learning_rate: 1e-4
  wm_weight_decay: 1e-5
  wm_batch_size: 1024
  policy_learning_rate: 0.001
  # Loss weights for reward and value heads (conservative: avoid destabilizing dynamics)
  reward_loss_weight: 0.1
  value_loss_weight: 0.01
  # Delay reward/value head training to let dynamics stabilize first
  rv_warmup_steps: 500

imagination:
  # Imagination is disabled in pretrain mode
  num_envs: 4096
  num_steps: 100
  uncertainty_penalty_weight: 0.0

logging:
  logger: tensorboard
  wandb_project: rwm-anymal
  run_name: pretrain-latent-rv
