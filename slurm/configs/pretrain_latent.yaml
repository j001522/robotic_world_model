# =============================================================================
# Latent-Space World Model Pretraining (Phase 1+2)
# =============================================================================
# Trains an ensemble world model with latent-space bottleneck.
# Architecture: Encoder (SimNorm) -> GRU backbone -> LatentDynamicsHead (SimNorm)
#               + Decoder for reconstruction loss + EMA target encoder
#
# Training signal (combined as state_loss):
#   state_loss = consistency_coef * MSE(z_pred, z_target_ema)    [JEPA-style with EMA]
#              + reconstruction_coef * MSE(dec(z_pred), s_next)  [reconstruction]
#              + encoder_consistency_coef * MSE(enc(s_next), sg(z_pred)) [bidirectional]
#
# Usage:
#   sbatch --job-name=pretrain-latent --partition=gpu_a100 --time=24:00:00 \
#          slurm_train.sh configs/pretrain_latent.yaml
# =============================================================================

mode: pretrain
task: Template-Isaac-Velocity-Flat-Anymal-D-Pretrain-v0
max_iterations: 2500

model:
  # Ensemble configuration
  ensemble_size: 5
  
  # Latent-space architecture (Phase 1)
  latent_mode: true
  latent_dim: 256
  simnorm_dim: 8
  encoder_hidden_dims: [256]
  decoder_hidden_dims: [256]
  latent_head_hidden_dims: [256]
  encoder_dropout: 0.0
  
  # Phase 2: Consistency loss with EMA target encoder
  target_encoder_momentum: 0.99
  consistency_coef: 0.0
  reconstruction_coef: 1.0
  encoder_consistency_coef: 0.0  # Set to 1.0 to enable bidirectional loss
  
  # Randomized priors
  prior_scale: 1.0
  prior_hidden_div: 4
  bootstrap: false
  uncertainty_metric: std

training:
  num_envs: 4096
  wm_learning_rate: 1e-4
  wm_weight_decay: 1e-5
  wm_batch_size: 1024
  policy_learning_rate: 0.001  # Not used in pretrain but set for consistency

imagination:
  # Imagination is disabled in pretrain mode
  # These parameters are kept for config consistency
  num_envs: 4096
  num_steps: 100
  uncertainty_penalty_weight: 0.0  # No penalty during pretrain
  latent_native_imagination: false  # Not relevant during pretrain (no imagination)

logging:
  logger: tensorboard
  wandb_project: rwm-anymal
  run_name: pretrain-latent-rec_only_bi
