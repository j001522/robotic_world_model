# =============================================================================
# Standard Ensemble World Model Pretraining
# =============================================================================
# Trains a 5-member ensemble without latent space (raw state prediction).
# Used as baseline or for ablation studies.
#
# Usage:
#   sbatch --job-name=pretrain-ensemble --partition=gpu_a100 --time=24:00:00 \
#          slurm_train.sh configs/pretrain_ensemble.yaml
# =============================================================================

mode: pretrain
task: Template-Isaac-Velocity-Flat-Anymal-D-Pretrain-v0
max_iterations: 2500

model:
  # Ensemble configuration
  ensemble_size: 5
  
  # Raw state prediction (no latent space)
  latent_mode: false
  latent_dim: 256  # Ignored when latent_mode=false
  
  # Randomized priors
  prior_scale: 0.0
  prior_hidden_div: 4
  bootstrap: true
  uncertainty_metric: std


training:
  num_envs: 4096
  wm_learning_rate: 1e-4
  wm_weight_decay: 1e-5
  wm_batch_size: 1024
  policy_learning_rate: 0.001

imagination:
  # Imagination is disabled in pretrain mode
  num_envs: 4096
  num_steps: 100
  uncertainty_penalty_weight: 0.0  # No penalty during pretrain

logging:
  logger: tensorboard
  wandb_project: rwm-anymal
  run_name: pretrain-ensemble-baseline
