# =============================================================================
# xLSTM Latent-Space World Model Finetuning
# =============================================================================
# Finetunes a policy using a pretrained xLSTM latent-space world model.
# Combines Phase 1+2 architecture (Encoder -> xLSTM -> LatentHead -> Decoder)
# with imagination rollouts for MBPO-PPO training.
#
# Prerequisites:
#   - Update checkpoint.load_run to point to your xLSTM latent pretrain run
#   - Ensure ALL model parameters match pretrain_xlstm_latent.yaml exactly
#   - Architecture parameters (xlstm_*) must be identical to pretrain
#
# Usage:
#   sbatch --job-name=finetune-xlstm --partition=gpu_a100 --time=24:00:00 \
#          slurm_train.sh configs/finetune_xlstm_latent.yaml
# =============================================================================

mode: finetune
task: Template-Isaac-Velocity-Flat-Anymal-D-Finetune-v0
max_iterations: 2500

model:
  # MUST match pretrain configuration exactly
  ensemble_size: 5
  
  # Latent-space architecture (must match pretrain)
  latent_mode: true
  latent_dim: 256
  simnorm_dim: 8
  encoder_hidden_dims: [256]
  decoder_hidden_dims: [256]
  latent_head_hidden_dims: [256]
  encoder_dropout: 0.0
  
  # Consistency loss (can be reduced during finetune if needed)
  target_encoder_momentum: 0.99
  consistency_coef: 1.0
  reconstruction_coef: 1.0
  encoder_consistency_coef: 0.0
  
  # Randomized priors (must match pretrain)
  prior_scale: 1.0
  prior_hidden_div: 4
  bootstrap: false
  uncertainty_metric: std

architecture:
  # Backbone type: xlstm
  type: xlstm
  
  # xLSTM-specific parameters (MUST match pretrain exactly)
  xlstm_embedding_dim: 256      # Internal embedding dimension (= output dim)
  xlstm_num_blocks: 2          # Number of xLSTM blocks
  xlstm_num_heads: 4            # Number of heads for mLSTM/sLSTM
  xlstm_context_length: 64      # Max sequence length for causal mask buffer
  xlstm_conv1d_kernel_size: 4   # Causal conv1d kernel size
  xlstm_slstm_at: []            # Block indices using sLSTM (empty = all mLSTM)
  xlstm_slstm_backend: vanilla  # "vanilla" (any GPU) or "cuda" (requires CC >= 8.0)
  xlstm_proj_factor_mlstm: 2.0  # mLSTM up-projection factor
  xlstm_proj_factor_slstm_ff: 1.3  # sLSTM feedforward projection factor
  xlstm_dropout: 0.0            # Dropout rate
  
  # Head shapes (shared across all backbone types, must match pretrain)
  state_mean_shape: [128]
  state_logstd_shape: [128]
  extension_shape: [128]
  contact_shape: [128]
  termination_shape: [128]

training:
  num_envs: 4096
  wm_learning_rate: 1e-4
  wm_weight_decay: 1e-5
  wm_batch_size: 512
  policy_learning_rate: 0.001

imagination:
  num_envs: 4096
  num_steps: 100
  uncertainty_penalty_weight: 0.0
  latent_native_imagination: true  # Keep dynamics in latent space during imagination (no re-encoding)

checkpoint:
  resume: true
  # UPDATE THIS: Path to your xLSTM latent pretrain run directory (timestamp folder)
  load_run: "2026-02-14_14-41-13_pretrain-xlstm-latent"
  checkpoint: model_2500.pt
  system_dynamics_load_path: "logs/rsl_rl/anymal_d_flat/2026-02-14_14-41-13_pretrain-xlstm-latent/model_2500.pt"

logging:
  logger: tensorboard
  wandb_project: rwm-anymal
  run_name: finetune-xlstm-latent
