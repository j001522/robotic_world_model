# =============================================================================
# xLSTM Latent-Space World Model Pretraining
# =============================================================================
# Trains an ensemble world model with xLSTM backbone + latent-space bottleneck.
# Architecture: Encoder (SimNorm) -> xLSTM backbone -> LatentDynamicsHead (SimNorm)
#               + Decoder for reconstruction loss + EMA target encoder
#
# The xLSTM backbone uses matrix-memory LSTM (mLSTM) blocks by default,
# which are fully parallelizable and don't require custom CUDA compilation.
# sLSTM blocks can be placed at specific indices via xlstm_slstm_at.
#
# Training signal (combined as state_loss):
#   state_loss = consistency_coef * MSE(z_pred, z_target_ema)    [JEPA-style with EMA]
#              + reconstruction_coef * MSE(dec(z_pred), s_next)  [reconstruction]
#              + encoder_consistency_coef * MSE(enc(s_next), sg(z_pred)) [bidirectional]
#
# Usage:
#   sbatch --job-name=pretrain-xlstm --partition=gpu_a100 --time=24:00:00 \
#          slurm_train.sh configs/pretrain_xlstm_latent.yaml
# =============================================================================

mode: pretrain
task: Template-Isaac-Velocity-Flat-Anymal-D-Pretrain-v0
max_iterations: 2500

model:
  # Ensemble configuration
  ensemble_size: 5
  
  # Latent-space architecture
  latent_mode: true
  latent_dim: 256
  simnorm_dim: 8
  encoder_hidden_dims: [256]
  decoder_hidden_dims: [256]
  latent_head_hidden_dims: [256]
  encoder_dropout: 0.0
  
  # Consistency loss with EMA target encoder
  target_encoder_momentum: 0.99
  consistency_coef: 1.0
  reconstruction_coef: 1.0
  encoder_consistency_coef: 0.0  # Set to 1.0 to enable bidirectional loss
  
  # Randomized priors
  prior_scale: 1.0
  prior_hidden_div: 4
  bootstrap: false
  uncertainty_metric: std

architecture:
  # Backbone type: xlstm
  type: xlstm
  
  # xLSTM-specific parameters
  xlstm_embedding_dim: 256      # Internal embedding dimension (= output dim)
  xlstm_num_blocks: 2          # Number of xLSTM blocks
  xlstm_num_heads: 4            # Number of heads for mLSTM/sLSTM
  xlstm_context_length: 64      # Max sequence length for causal mask buffer
  xlstm_conv1d_kernel_size: 4   # Causal conv1d kernel size
  xlstm_slstm_at: []            # Block indices using sLSTM (empty = all mLSTM)
  xlstm_slstm_backend: vanilla  # "vanilla" (any GPU) or "cuda" (requires CC >= 8.0)
  xlstm_proj_factor_mlstm: 2.0  # mLSTM up-projection factor
  xlstm_proj_factor_slstm_ff: 1.3  # sLSTM feedforward projection factor
  xlstm_dropout: 0.0            # Dropout rate
  
  # Head shapes (shared across all backbone types)
  state_mean_shape: [128]
  state_logstd_shape: [128]
  extension_shape: [128]
  contact_shape: [128]
  termination_shape: [128]

training:
  num_envs: 4096
  wm_learning_rate: 1e-4
  wm_weight_decay: 1e-5
  wm_batch_size: 512
  policy_learning_rate: 0.001  # Not used in pretrain but set for consistency

imagination:
  # Imagination is disabled in pretrain mode
  num_envs: 4096
  num_steps: 100
  uncertainty_penalty_weight: 0.0

logging:
  logger: tensorboard
  wandb_project: rwm-anymal
  run_name: pretrain-xlstm-latent
